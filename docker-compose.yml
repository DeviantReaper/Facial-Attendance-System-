version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: faceattend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: faceattend_user
      POSTGRES_PASSWORD: faceattend_pass
      POSTGRES_DB: faceattend_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceattend_user -d faceattend_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session caching — optional) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: faceattend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faceattend_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://faceattend_user:faceattend_pass@db:5432/faceattend_db
      JWT_SECRET: CHANGE_THIS_IN_PRODUCTION
      EMAILS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./frontend/public/models:/app/frontend/public/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React Frontend (served via nginx) ────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: faceattend_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
